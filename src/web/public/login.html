<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberBOT - Giriş</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='48' font-weight='bold' text-anchor='middle' fill='white'>CB</text></svg>">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary);
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('/images/CyberBOT-Banner.png') center/cover no-repeat;
      opacity: 0.04;
      pointer-events: none;
    }
    .login-embed {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
    }
    .embed-banner {
      height: 80px;
      background: url('/images/CyberBOT-Banner.png') center/cover no-repeat;
      position: relative;
    }
    .embed-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, var(--bg-secondary));
    }
    .embed-body {
      padding: 0 24px 32px;
      margin-top: -40px;
      position: relative;
    }
    .embed-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--bg-secondary);
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
    }
    .embed-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .embed-title {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .embed-desc {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .embed-divider {
      height: 1px;
      background: var(--surface-border);
      margin: 0 -24px 24px;
    }
    .embed-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .embed-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }
    .embed-btn-primary {
      background: #5865f2;
      color: white;
    }
    .embed-btn-primary:hover {
      background: #4752c4;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(88, 101, 242, 0.3);
    }
    .embed-btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--surface-border);
    }
    .embed-btn-secondary:hover {
      background: var(--surface-hover);
      border-color: var(--accent-border);
      transform: translateY(-1px);
    }
    .embed-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .embed-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
    .embed-footer svg {
      width: 14px;
      height: 14px;
    }
    @media (max-width: 480px) {
      .login-embed { margin: 16px; }
      .embed-body { padding: 0 16px 24px; }
      .embed-divider { margin: 0 -16px 20px; }
    }
  </style>
</head>
<body>
  <div class="login-embed">
    <div class="embed-banner"></div>
    <div class="embed-body">
      <div class="embed-avatar">
        <img src="/images/CyberBOT-profile.png" alt="CyberBOT">
      </div>
      <div class="embed-title">CyberBOT</div>
      <div class="embed-desc">Premium Discord bot paneline erişim için Discord hesabınızla giriş yapın.</div>
      <div class="embed-divider"></div>
      <div class="embed-buttons">
        <a href="/api/auth/login" class="embed-btn embed-btn-primary">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Discord ile giriş yap
        </a>
        <a href="/api/auth/support" class="embed-btn embed-btn-secondary" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Destek sunucusu
        </a>
      </div>
      <div class="embed-footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        CyberBOT v1.0.0 &middot; Premium Discord Bot
      </div>
    </div>
  </div>
</body>
</html>
